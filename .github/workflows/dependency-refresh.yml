name: Dependency Refresh

on:
  push:
    branches: [feat/chain-service-auth]
    paths:
      - 'package.json'
      - '.github/workflows/dependency-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chain-service-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh patched transitive dependencies'
          git push origin HEAD:feat/chain-service-auth
