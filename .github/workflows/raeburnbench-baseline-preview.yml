name: RaeburnBench Baseline Preview

on:
  push:
    branches:
      - feat/raeburnbench-core

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate exact reviewed reference artifact
        run: |
          npm run bench:run -- --out /tmp/reference.v0.json >/dev/null
          echo 'RAEBURNBENCH_BASELINE_BEGIN'
          cat /tmp/reference.v0.json
          echo 'RAEBURNBENCH_BASELINE_END'
