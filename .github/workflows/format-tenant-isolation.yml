name: Format tenant isolation branch

on:
  push:
    branches: [feat/tenant-isolation-suite]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tenant-isolation-suite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/human-tenant.ts src/lib/orchestrator.ts src/lib/tenant-isolation.integration.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/human-tenant.ts src/lib/orchestrator.ts src/lib/tenant-isolation.integration.test.ts
            git commit -m "style(tenancy): normalize isolation files"
            git push
          fi
