name: Normalize DR README formatting

on:
  push:
    branches: [feat/postgres-backup-restore-drill]

permissions:
  contents: write

jobs:
  format-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/postgres-backup-restore-drill
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Format README with repository Prettier
        run: npx prettier --write README.md
      - name: Commit canonical README formatting
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'style: apply canonical README formatting'
          git push origin HEAD:feat/postgres-backup-restore-drill
