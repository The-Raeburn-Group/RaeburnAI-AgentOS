name: Format provider contract branch

on:
  push:
    branches:
      - feat/provider-execution-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Node runtime
        run: node --version && npm --version
      - name: Install deterministic dependencies
        run: npm ci
      - name: Apply pinned Prettier
        run: npm run format
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .github/workflows/ci.yml docs package.json src
          git commit -m "style(provider): apply pinned Prettier"
          git push origin HEAD:feat/provider-execution-contract
