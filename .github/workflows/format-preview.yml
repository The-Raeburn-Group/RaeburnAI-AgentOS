name: Format Preview

on:
  push:
    branches:
      - feat/expert-collaboration-evidence-protocol

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier src/lib/collaboration.integration.test.ts src/lib/collaboration.test.ts src/lib/collaboration.ts src/lib/types.ts --write
          git diff -- src/lib/collaboration.integration.test.ts src/lib/collaboration.test.ts src/lib/collaboration.ts src/lib/types.ts
