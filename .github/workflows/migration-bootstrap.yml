name: Migration Bootstrap

on:
  push:
    branches: [feat/chain-service-auth]
    paths:
      - '.github/workflows/migration-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chain-service-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate initial PostgreSQL migration from schema
        run: |
          mkdir -p prisma/migrations/20260905000000_init
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20260905000000_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Commit migration
        run: |
          if [ -z "$(git status --porcelain -- prisma/migrations)" ]; then
            echo 'Migration already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/migrations
          git commit -m 'chore: add initial Prisma migration'
          git push origin HEAD:feat/chain-service-auth
