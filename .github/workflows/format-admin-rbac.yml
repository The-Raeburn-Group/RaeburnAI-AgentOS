name: Format admin RBAC branch

on:
  push:
    branches: [feat/admin-rbac]
    paths:
      - .github/workflows/format-admin-rbac.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-rbac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize final RBAC security files
        run: >-
          npx prettier --write
          src/lib/admin-auth.ts
          src/lib/admin-auth.test.ts
          src/app/api/metrics/route.ts
          src/lib/service-auth.ts
          src/lib/service-auth.test.ts
          src/app/api/workflows/run/route.ts
          src/lib/orchestrator.ts
      - name: Commit normalization if needed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/admin-auth.ts src/lib/admin-auth.test.ts src/app/api/metrics/route.ts src/lib/service-auth.ts src/lib/service-auth.test.ts src/app/api/workflows/run/route.ts src/lib/orchestrator.ts
            git commit -m "style(auth): normalize final RBAC security files"
            git push origin HEAD:feat/admin-rbac
          fi
