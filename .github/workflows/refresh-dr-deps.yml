name: Refresh DR dependency lock

on:
  push:
    branches: [feat/postgres-backup-restore-drill]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/postgres-backup-restore-drill
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install refreshed dependency graph
        run: npm ci
      - name: Normalize repository formatting
        run: npm run format
      - name: Verify high-severity dependency audit
        run: npm audit --audit-level=high
      - name: Commit refreshed lock and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json scripts/postgres-dr.ts docs/BACKUP_AND_RECOVERY.md
          git commit -m 'build(dr): refresh secure dependency lock and formatting'
          git push origin HEAD:feat/postgres-backup-restore-drill
