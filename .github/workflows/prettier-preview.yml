name: Prettier Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render exact Prettier diff
        run: |
          npx prettier --write src/app/api/approvals/exceptions/route.test.ts src/lib/approval-exceptions.integration.test.ts src/lib/approval-exceptions.ts
          git diff -- src/app/api/approvals/exceptions/route.test.ts src/lib/approval-exceptions.integration.test.ts src/lib/approval-exceptions.ts
