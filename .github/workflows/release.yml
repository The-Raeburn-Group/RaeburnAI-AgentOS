name: Release trust package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: postgresql://agentos:agentos@localhost:5432/agentos?schema=public
      NEXTAUTH_SECRET: release-validation-placeholder-not-production
      RAEBURN_CHAIN_SERVICE_TOKEN: release-validation-placeholder-not-production
      OLLAMA_BASE_URL: http://localhost:11434
      DEFAULT_MODEL_PROVIDER: ollama
      DEFAULT_MODEL: llama3.1
      CI: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentos
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      - name: Validate software supply-chain policy
        run: npm run validate:supply-chain
      - name: Enforce zero High/Critical dependency gate
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply migrations
        run: npm run db:migrate
      - name: Run quality and build verification
        run: npm run verify
      - name: Build deterministic container image
        run: docker build -t raeburnai-agentos:${{ github.sha }} .
      - name: Scan container for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: raeburnai-agentos:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Create release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          artifact="${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz"
          tar --exclude='.git' --exclude='node_modules' --exclude='**/node_modules' -czf "$artifact" .
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Stage immutable RaeburnBench release evidence
        shell: bash
        run: cp benchmarks/results/reference.v0.json raeburnbench-reference.v0.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            "${{ steps.package.outputs.artifact }}" \
            package-lock.json \
            raeburnbench-reference.v0.json \
            sbom.spdx.json \
            sbom.cdx.json \
            > SHA256SUMS
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Sign release trust artifacts
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle release.tar.gz.sigstore "${{ steps.package.outputs.artifact }}"
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore SHA256SUMS
          cosign sign-blob --yes --bundle raeburnbench-reference.v0.json.sigstore raeburnbench-reference.v0.json
          cosign sign-blob --yes --bundle sbom.spdx.json.sigstore sbom.spdx.json
          cosign sign-blob --yes --bundle sbom.cdx.json.sigstore sbom.cdx.json
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ steps.package.outputs.artifact }}'
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ steps.package.outputs.artifact }}'
          sbom-path: sbom.spdx.json
      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ steps.package.outputs.artifact }}'
          sbom-path: sbom.cdx.json
      - name: Create verification guide
        shell: bash
        run: |
          cat > TRUST-PACKAGE.txt <<'EOF'
          RaeburnAI AgentOS release trust package

          Release publication is blocked by quality checks, RaeburnBench seed-baseline drift,
          High/Critical dependency findings, High/Critical container findings, build failure
          or supply-chain policy drift.

          Verify checksums:
            sha256sum -c SHA256SUMS

          Verify GitHub provenance:
            gh attestation verify <artifact> --repo ${{ github.repository }}

          Verify a Sigstore bundle:
            cosign verify-blob --bundle <file>.sigstore <file>
          EOF
      - name: Publish release and trust package
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.artifact }}
            SHA256SUMS
            raeburnbench-reference.v0.json
            raeburnbench-reference.v0.json.sigstore
            sbom.spdx.json
            sbom.cdx.json
            release.tar.gz.sigstore
            SHA256SUMS.sigstore
            sbom.spdx.json.sigstore
            sbom.cdx.json.sigstore
            TRUST-PACKAGE.txt
