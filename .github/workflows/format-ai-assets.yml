name: Format AI asset branch

on:
  push:
    branches:
      - ai-asset-control-20260924

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      - name: Apply pinned Prettier
        run: npx prettier --write src/lib/model-registry.ts src/lib/model-registry.test.ts src/lib/optimization-control.ts src/lib/optimization-control.test.ts src/lib/optimization-control.integration.test.ts src/app/api/models/registry/route.ts src/app/api/models/registry/route.test.ts src/app/api/optimization/experiments/route.ts src/app/api/optimization/experiments/route.test.ts src/app/api/marketplace/route.ts src/app/api/marketplace/route.test.ts scripts/model-registry.ts scripts/optimization-bench.ts scripts/postgres-dr.ts docs/AI_ASSET_CONTROL.md
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          git commit -m "style(ai-assets): apply pinned Prettier"
          git push origin HEAD:ai-asset-control-20260924
