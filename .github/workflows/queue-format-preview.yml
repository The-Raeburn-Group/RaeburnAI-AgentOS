name: Queue Format Preview

on:
  push:
    branches:
      - feat/durable-workflow-queue

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier \
            src/app/api/workflows/jobs/cancel/route.ts \
            src/app/api/workflows/jobs/route.ts \
            src/lib/env.ts \
            src/lib/workflow-queue.integration.test.ts \
            src/lib/workflow-queue.ts \
            scripts/workflow-worker.ts \
            --write
          git diff -- \
            src/app/api/workflows/jobs/cancel/route.ts \
            src/app/api/workflows/jobs/route.ts \
            src/lib/env.ts \
            src/lib/workflow-queue.integration.test.ts \
            src/lib/workflow-queue.ts \
            scripts/workflow-worker.ts
