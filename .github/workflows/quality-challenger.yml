name: Quality challenger gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate model registry
        run: npm run models:verify
      - name: Execute benchmark promotion gate
        run: npm run bench:quality
      - name: Execute offline configuration optimization gate
        run: npm run bench:optimization
