name: Format Refresh

on:
  push:
    branches: [feat/chain-service-auth]
    paths:
      - 'package.json'
      - '.github/workflows/format-refresh.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chain-service-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize source formatting
        run: npx prettier --write "src/**/*.{ts,tsx}" "*.md" "docs/**/*.md"
      - name: Commit and publish formatting
        run: |
          if [ -z "$(git status --porcelain -- src README.md docs)" ]; then
            echo 'Source formatting already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src README.md docs
          git commit -m 'style: normalize AgentOS source formatting'
          git fetch origin feat/chain-service-auth
          git rebase origin/feat/chain-service-auth
          git push origin HEAD:feat/chain-service-auth
