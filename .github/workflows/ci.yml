name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentos
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://agentos:agentos@localhost:5432/agentos?schema=public
      AGENTOS_RESTORE_DATABASE_URL: postgresql://agentos:agentos@localhost:5432/agentos_restore?schema=public
      NEXTAUTH_SECRET: test-secret-for-ci-only-change-in-prod
      RAEBURN_CHAIN_SERVICE_TOKEN: test-chain-service-token-for-ci-only
      OLLAMA_BASE_URL: http://localhost:11434
      DEFAULT_MODEL_PROVIDER: ollama
      DEFAULT_MODEL: llama3.1
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version
      - name: Seed deterministic two-tenant recovery fixture
        run: npm run dr:seed
      - name: Create manifest-verified logical backup
        run: npm run dr:backup
      - name: Create isolated restore database
        env:
          PGPASSWORD: agentos
        run: createdb --host localhost --port 5432 --username agentos agentos_restore
      - name: Restore backup into isolated database
        env:
          DATABASE_URL: ${{ env.AGENTOS_RESTORE_DATABASE_URL }}
        run: npm run dr:restore
      - name: Prove restored Prisma migration state is forward-safe
        env:
          DATABASE_URL: ${{ env.AGENTOS_RESTORE_DATABASE_URL }}
        run: npm run db:migrate
      - name: Verify restored tenant, run, memory, approval and audit state
        env:
          DATABASE_URL: ${{ env.AGENTOS_RESTORE_DATABASE_URL }}
        run: npm run dr:verify
      - run: npm run build
      - run: docker build -t raeburnai-agentos .
