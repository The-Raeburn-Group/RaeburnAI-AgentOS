name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentos
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://agentos:agentos@localhost:5432/agentos?schema=public
      AGENTOS_RESTORE_DATABASE_URL: postgresql://agentos:agentos@localhost:5432/agentos_restore?schema=public
      NEXTAUTH_SECRET: test-secret-for-ci-only-change-in-prod
      RAEBURN_CHAIN_SERVICE_TOKEN: test-chain-service-token-for-ci-only
      OLLAMA_BASE_URL: http://localhost:11434
      DEFAULT_MODEL_PROVIDER: ollama
      DEFAULT_MODEL: llama3.1
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      - name: Validate software supply-chain policy
        run: npm run validate:supply-chain
      - name: Enforce zero High/Critical dependency gate
        run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify immutable RaeburnBench seed baseline
        run: npm run bench:verify
      - name: Benchmark executable expert routing policy
        run: npm run bench:routing
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version
      - name: Seed deterministic two-tenant recovery fixture
        run: npm run dr:seed
      - name: Create manifest-verified logical backup
        run: npm run dr:backup
      - name: Create isolated restore database
        env:
          PGPASSWORD: agentos
        run: createdb --host localhost --port 5432 --username agentos agentos_restore
      - name: Restore backup into isolated database
        env:
          DATABASE_URL: ${{ env.AGENTOS_RESTORE_DATABASE_URL }}
        run: npm run dr:restore
      - name: Prove restored Prisma migration state is forward-safe
        env:
          DATABASE_URL: ${{ env.AGENTOS_RESTORE_DATABASE_URL }}
        run: npm run db:migrate
      - name: Verify restored tenant, run, memory, approval, evaluation and audit state
        env:
          DATABASE_URL: ${{ env.AGENTOS_RESTORE_DATABASE_URL }}
        run: npm run dr:verify
      - run: npm run build
      - name: Build deterministic container image
        run: docker build -t raeburnai-agentos:${{ github.sha }} .
      - name: Scan container for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: raeburnai-agentos:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
